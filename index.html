<!doctype html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Calificaciones</title>

    <!-- ====================== AOS ====================== -->
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>

    <!-- ====================== JS ====================== -->
    <script src="JS/verificacion.js"></script>
    <script src="JS/app.js"></script>

    <!-- ====================== BOOTSTRAP ====================== -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

    <!-- ====================== SWEET ALERT ====================== -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@sweetalert2/theme-dark@5/dark.css" />
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.js"></script>

    <!-- ====================== ANIMATE CSS ====================== -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" />

    <!-- ====================== CSS ====================== -->
    <link href="CSS/style.css" rel="stylesheet" />

    <!-- =============== ROBOTO FONT =============== -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100;0,300;0,400;0,500;0,700;0,900;1,100;1,300;1,400;1,500;1,700;1,900&display=swap"
        rel="stylesheet">

    <!-- =============== GOOGLE ICONS =============== -->
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
</head>

<body class="bg1">
    <div class="container mt-5">
        <!-- ================================== SECCION 1 ================================== -->
        <div class="p-5 bgSec" id="Seccion1">
            <h1 data-aos="fade-up"
            data-aos-duration="1500">Calificación Alumnos</h1>
            <hr data-aos="zoom-in"
            data-aos-duration="3000"
            class="mb-5" style="border: 1px rgba(255, 255, 255, 0.4) solid;">
            <div class="row">
                <div class="col me-3">
                    <h2 data-aos="fade-right"
                    data-aos-duration="1500"
                    class="d-flex justify-content-center align-items-center">
                        <span class="material-symbols-outlined me-2">auto_stories</span>
                        Datos del Alumno
                    </h2>
                    <hr data-aos="zoom-in"
                    data-aos-duration="3000"
                    class="mb-5" style="border: 1px rgba(255, 255, 255, 0.2) solid;">
                    <div class="mt-4" data-aos="fade-down" data-aos-duration="3000">
                        <div class="row">
                            <div class="col">
                                <label>Numero de Contol</label>
                                <input type="text" class="form-control inputCustom"
                                    placeholder="Ingresa tu Apellido Paterno" id="txtNoControl" />
                            </div>
                            <div class="col">
                                <label>Nombre</label>
                                <input type="text" class="form-control inputCustom"
                                    placeholder="Ingresa tu Apellido Paterno" id="txtNombre" />
                            </div>
                        </div>
                        <div class="row">
                            <div class="col">
                                <label class="mt-3">Apellido Paterno</label>
                                <input type="text" class="form-control inputCustom"
                                    placeholder="Ingresa tu Apellido Paterno" id="txtApellidoPat" />
                            </div>

                            <div class="col">
                                <label class="mt-3">Apellido Materno</label>
                                <input type="text" class="form-control inputCustom"
                                    placeholder="Ingresa tu Apellido Materno" id="txtApellidoMat" />
                            </div>
                        </div>
                    </div>

                    <div id="SexoSelector" class="mt-4 text-start col-6" data-aos="fade-down" data-aos-duration="3000">
                        <p class="form-check-inline">Sexo:</p>
                        <div class="form-check form-check-inline">
                            <label class="form-check-label" for="inlineRadio1">
                                <input class="form-check-input" type="radio" name="sexoRad" id="rdSexH" value="option1">
                                Hombre
                            </label>
                        </div>
                        <div class="form-check form-check-inline">
                            <label class="form-check-label" for="inlineRadio2">
                                <input class="form-check-input" type="radio" name="sexoRad" id="rdSexM" value="option2">
                                Mujer
                            </label>
                        </div>
                    </div>
                </div>
                <div class="col ms-3">
                    <h2 data-aos="fade-right"
                    data-aos-duration="1500"
                    class="d-flex justify-content-center align-items-center">
                        <span class="material-symbols-outlined me-2">calendar_month</span>
                        Datos del Periodo
                    </h2>
                    <hr class="linaSubtitulo text-center mb-5"
                    data-aos="zoom-in"
                    data-aos-duration="3000"
                    style="border: 1px rgba(255, 255, 255, 0.2) solid;">
                    
                    <div id="subtituloAlertaPeriodo">
                        <p data-aos="fade-right"
                        data-aos-duration="1500"
                        class="subDatos d-flex justify-content-center align-items-center">
                            <span class="material-symbols-outlined me-2">arrow_right_alt</span>
                            Primero completa los datos del alumno
                        </p>
                    </div>

                    <div class="mt-4" data-aos="fade-down" data-aos-duration="3000">
                        <div class="row">
                            <div class="col">
                                <label>Cuatrimestre</label>
                                <select class="form-select inputCustom" id="slctCuatrimestre">
                                    <option value="0" selected>Selecciona el Cuatrimestre</option>
                                </select>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col">
                                <label class="mt-3">Unidad Academica</label>
                                <select class="form-select inputCustom" id="slctUnidad">
                                    <option value="0" selected>Selecciona la Unidad</option>
                                </select>
                            </div>
                            <div class="col">
                                <label class="mt-3">Periodo</label>
                                <input type="text" class="form-control inputCustom" placeholder="Ej. 23300056"
                                    id="txtPeriodo" />
                            </div>
                        </div>
                    </div>




                </div>
            </div>
            <div data-aos="fade-right"
            data-aos-duration="1500"
            class="text-center">
                <button class="mt-2 btn btnCustom" data-bs-toggle="modal" data-bs-target="#exampleModal"
                    id="btnAgregar">Agregar una Materia</button>
            </div>
        </div>

        <hr class="lineDivisora">

        <!-- ================================== SECCION 2 ================================== -->
        <div class="p-5 mt-2 bgSec2" id="Seccion2">
            <h2>Datos Materia</h2>
            <hr>
            <table class="table table-dark table-hover">
                <thead>
                    <tr class="text-center">
                        <td>Materia</td>
                        <td>Calificacion</td>
                        <td>Cuatrimestre</td>
                        <td>Acciones</td>
                    </tr>
                </thead>
                <tbody id="tablaMateria">

                </tbody>
            </table>

            <div class="text-center">
                <button class="mt-2 btn btnCustom" id="submitBD" disabled>Subir Calificaciones</button>
            </div>
        </div>

        <!-- ================================== Modal Calificacion ================================== -->
        <div class="modal fade" id="exampleModal" tabindex="-1" aria-labelledby="tituloModal" aria-hidden="true">
            <div class="modal-dialog modal-dialog-centered">
                <div class="modal-content bgModal p-5">

                    <h1 id="tituloModal">Registrar la Calificacion</h1>
                    <hr>

                    <div class="row mt-4">
                        <div class="col">
                            <label>Materia</label>
                            <input type="text" class="form-control inputCustom" placeholder="Ingresa la Materia"
                                id="txtMateriaMod" />
                        </div>
                        <div class="col">
                            <label>Calificacion</label>
                            <input type="text" class="form-control inputCustom" placeholder="Ej. 100"
                                id="txtCalificacionMod" />
                        </div>
                    </div>

                    <div class="mt-5 text-center">
                        <h4>Tipo de Calificaion</h4>
                        <hr>
                        <div class="form-check form-check-inline">
                            <label>
                                <input class="form-check-input" type="radio" name="califRadio" value="option1"
                                    id="radOrdinalMod">
                                Ordinal
                            </label>
                        </div>
                        <div class="form-check form-check-inline">
                            <label>
                                <input class="form-check-input" type="radio" name="califRadio" value="option2"
                                    id="radRemedialMod">
                                Remedial
                            </label>
                        </div>
                        <div class="form-check form-check-inline">
                            <label>
                                <input class="form-check-input" type="radio" name="califRadio" value="option3"
                                    id="radExtMod">
                                Extraordinaria
                            </label>
                        </div>
                    </div>
                    <div class="text-end">
                        <button type="button" class="btn btnCustom mt-5 me-2" id="btnModCancelar"
                            data-bs-dismiss="modal" aria-label="Close">Cancelar</button>
                        <button type="button" class="btn btnCustom mt-5" id="btnModRegistrar" data-bs-dismiss="modal"
                            aria-label="Close">Registrar</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>

    <script type="module" src="JS/firebase.js"></script>
    <script>AOS.init();</script>
</body>

</html>
